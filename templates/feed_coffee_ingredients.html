<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лента — Coffee Ingredients</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="page feed-page">
        <div class="video-container">
            <video class="feed-video" autoplay muted loop playsinline poster="{{.ingredient.ImageURL}}">
                <source src="{{.ingredient.VideoURL}}" type="video/mp4">
            </video>
            <div class="video-overlay"></div>
        </div>

        <div class="feed-content">
            <div class="feed-bottom">
                <h2 class="feed-title">{{.ingredient.Name}}</h2>
                <p class="feed-desc">{{.ingredient.Description}}</p>
                <span class="feed-more">Больше</span>
            </div>

            <div class="feed-right">
                <div class="param">
                    <span class="param-label">Цена</span>
                    <span class="param-value">{{printf "%.0f" .ingredient.Price}} ₽</span>
                </div>
                <div class="param">
                    <span class="param-label">Ед.</span>
                    <span class="param-value">{{.ingredient.Unit}}</span>
                </div>
                <div class="icon-block">
                    <span class="icon">♡</span>
                    <span class="count">{{.ingredient.LikesCount}}</span>
                </div>
                <a href="/feed-coffee-ingredients?id={{.ingredient.ID}}&next=true" class="next-btn">
                    <span>↓</span>
                </a>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/feed-coffee-ingredients" class="nav-item active">
            <span class="nav-icon">▶</span>
            <span class="nav-label">Лента</span>
        </a>
        <a href="/add-coffee-ingredients" class="nav-item">
            <span class="nav-icon">+</span>
            <span class="nav-label">Добавить</span>
        </a>
        <a href="/tiles-coffee-ingredients" class="nav-item">
            <span class="nav-icon">▦</span>
            <span class="nav-label">Плитка</span>
        </a>
    </nav>
</body>
</html>
