<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Добавление — Coffee Ingredients</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="page add-page">
        <header class="page-header">
            <h1>Новый ингредиент</h1>
        </header>

        <form class="add-form" action="#" method="get">
            <div class="media-box">
                <div class="media-preview-wrap">
                    <img src="{{.ingredient.ImageURL}}" alt="фото" class="media-preview">
                </div>
                <div class="media-placeholder">
                    <span class="plus">+</span>
                    <span>Добавить фото</span>
                </div>
                <input type="text" name="image_key" value="{{.ingredient.ImageKey}}" class="input media-key" placeholder="ключ изображения">
            </div>

            <div class="media-box">
                <div class="media-preview-wrap">
                    <video class="media-preview" muted loop playsinline autoplay poster="{{.ingredient.ImageURL}}">
                        <source src="{{.ingredient.VideoURL}}" type="video/mp4">
                    </video>
                </div>
                <div class="media-placeholder">
                    <span class="plus">+</span>
                    <span>Добавить видео</span>
                </div>
                <input type="text" name="video_key" value="{{.ingredient.VideoKey}}" class="input media-key" placeholder="ключ видео">
            </div>

            <div class="form-group">
                <label>Название</label>
                <input type="text" name="name" value="{{.ingredient.Name}}" class="input">
            </div>

            <div class="form-group">
                <label>Описание</label>
                <textarea name="description" class="input textarea" rows="2">{{.ingredient.Description}}</textarea>
            </div>

            <div class="form-group">
                <label>Цена за ед. (₽)</label>
                <input type="number" name="price" value="{{printf "%.0f" .ingredient.Price}}" class="input">
            </div>

            <div class="form-group">
                <label>Единица измерения</label>
                <input type="text" name="unit" value="{{.ingredient.Unit}}" class="input">
            </div>
            
        </form>
    </div>

    <nav class="bottom-nav">
        <a href="/feed-coffee-ingredients" class="nav-item">
            <span class="nav-icon">▶</span>
            <span class="nav-label">Лента</span>
        </a>
        <a href="/add-coffee-ingredients" class="nav-item active">
            <span class="nav-icon">+</span>
            <span class="nav-label">Добавить</span>
        </a>
        <a href="/tiles-coffee-ingredients" class="nav-item">
            <span class="nav-icon">▦</span>
            <span class="nav-label">Плитка</span>
        </a>
    </nav>
</body>
</html>
