<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Плитка — Coffee Ingredients</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="page grid-page">
        <header class="page-header">
            <h1>Все ингредиенты</h1>
        </header>

        <form class="filter-form" method="get" action="/tiles-coffee-ingredients">
            <label for="price">Цена (≤ ₽)</label>
            <div class="filter-row">
                <input type="number" id="price" name="price" value="{{.price}}" placeholder="макс. цена" class="input filter-input">
                <button type="submit" class="btn btn-primary filter-btn">Найти</button>
            </div>
        </form>

        <div class="cards-grid">
            {{range .ingredients}}
            <a href="/feed-coffee-ingredients?id={{.ID}}" class="card">
                <div class="card-img-wrap">
                    <img src="{{.ImageURL}}" alt="{{.Name}}" class="card-img">
                </div>
                <div class="card-body">
                    <h3 class="card-title">{{.Name}}</h3>
                    <p class="card-desc">{{.Description}}</p>
                    <div class="card-meta">
                        <span class="card-likes">♡ {{.LikesCount}}</span>
                        <span class="card-price">{{printf "%.0f" .Price}} ₽ / {{.Unit}}</span>
                    </div>
                </div>
            </a>
            {{else}}
            <p class="empty">Нет ингредиентов по фильтру</p>
            {{end}}
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/feed-coffee-ingredients" class="nav-item">
            <span class="nav-icon">▶</span>
            <span class="nav-label">Лента</span>
        </a>
        <a href="/add-coffee-ingredients" class="nav-item">
            <span class="nav-icon">+</span>
            <span class="nav-label">Добавить</span>
        </a>
        <a href="/tiles-coffee-ingredients" class="nav-item active">
            <span class="nav-icon">▦</span>
            <span class="nav-label">Плитка</span>
        </a>
    </nav>
</body>
</html>
